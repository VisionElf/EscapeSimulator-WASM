name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown

      - name: Test and build release files
        run: ./scripts/Build.ps1

      - name: Package release
        id: package
        run: |
          $archive = ./scripts/Package-Release.ps1 -Tag $env:RELEASE_TAG
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $assets = @($env:ARCHIVE, "$($env:ARCHIVE).sha256", 'release/EscapeSimulator.wasm')
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GH_REPO
          } else {
            $flags = @('--verify-tag', '--generate-notes', '--title', $env:RELEASE_TAG)
            if ($env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+-') { $flags += '--prerelease' }
            gh release create $env:RELEASE_TAG @assets @flags --repo $env:GH_REPO
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
